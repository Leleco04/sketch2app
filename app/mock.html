<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia simulada — Sketch2App</title>
  <script src="/vendor/tailwind.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #c2410c;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; font: 1.25rem/1.6 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { width: 100%; max-width: 38rem; background: var(--surface); padding: 2rem; border-radius: 1.25rem; box-sizing: border-box; }
    main h1 { line-height: 1.2; font-size: 2.25rem; }
    .badge { color: var(--secondary); font-weight: 700; }
    output { display: block; font-size: 4rem; font-weight: 700; margin: 1rem 0; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; }
    .actions button { border: 2px solid var(--primary); border-radius: .75rem; padding: .75rem 1.25rem; font: inherit; font-weight: 600; cursor: pointer; background: var(--primary); color: var(--surface); }
    .actions button.secondary { background: var(--surface); color: var(--primary); }
    button:hover { filter: brightness(.9); }
    button:focus-visible { outline: 3px solid var(--secondary); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="badge">SIMULAÇÃO</p>
    <h1>Prévia interativa</h1>
    <p>Conteúdo de demonstração para testar o painel sem consumir cota de geração.</p>
    <output id="count" aria-live="polite" aria-label="Contador de cliques">0</output>
    <div class="actions">
      <button type="button" id="increment">Adicionar clique</button>
      <button type="button" id="reset" class="secondary">Zerar</button>
    </div>
  </main>
  <script>
    let count = 0;
    const output = document.getElementById('count');
    document.getElementById('increment').addEventListener('click', () => {
      count += 1;
      output.textContent = count;
    });
    document.getElementById('reset').addEventListener('click', () => {
      count = 0;
      output.textContent = count;
    });
  </script>
</body>
</html>
